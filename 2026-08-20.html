<style>
:root{ color-scheme:light dark; }
body{ margin:0; min-height:100svh; display:grid; place-items:center; padding:1.5rem;
  background:#faf8f4; color:#2b2724; font-family:"Zen Kaku Gothic New",system-ui,sans-serif; }
@media (prefers-color-scheme:dark){ body{ background:#16130f; color:#ece7de; } }
.gate{ width:min(22rem,100%); text-align:center; }
.gate .eyebrow{ font-family:"Jost",sans-serif; font-size:.72rem; letter-spacing:.22em;
  text-transform:uppercase; opacity:.55; }
.gate h1{ font-weight:400; font-size:1.6rem; margin:.6rem 0 1.8rem; }
.gate input{ width:100%; box-sizing:border-box; padding:.8rem .9rem; font-size:1rem;
  font-family:inherit; border:1px solid currentColor; border-radius:.4rem;
  background:transparent; color:inherit; }
.gate button{ margin-top:.7rem; width:100%; padding:.8rem; font-family:"Jost",sans-serif;
  letter-spacing:.1em; font-size:.85rem; border:0; border-radius:.4rem; cursor:pointer;
  background:#2b2724; color:#faf8f4; }
@media (prefers-color-scheme:dark){ .gate button{ background:#ece7de; color:#16130f; } }
.gate p{ font-size:.78rem; opacity:.6; margin-top:1.4rem; line-height:1.8; }
.err{ color:#b3402f; font-size:.82rem; min-height:1.2em; margin-top:.7rem; }
</style>

const KEY = "lazydiary-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  try { const html = await open_(pw); sessionStorage.setItem(KEY, pw); show(html); }
  catch { document.getElementById("e").textContent = "合言葉が違うようです"; }
});
// 同じセッション中は、ページを移っても入力し直さなくてよい
(async () => {
  const saved = sessionStorage.getItem(KEY);
  if (saved) { try { show(await open_(saved)); } catch { sessionStorage.removeItem(KEY); } }
})();
