async function open_(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  try { const html = await open_(pw); sessionStorage.setItem(KEY, pw); show(html); }
  catch { document.getElementById("e").textContent = "合言葉が違うようです"; }
});
// 同じセッション中は、ページを移っても入力し直さなくてよい
(async () => {
  const saved = sessionStorage.getItem(KEY);
  if (saved) { try { show(await open_(saved)); } catch { sessionStorage.removeItem(KEY); } }
})();
